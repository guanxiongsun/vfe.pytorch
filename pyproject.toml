[project]
name = "vfe"
dynamic = ["version"]                      # from vfe.__version__
description = "Video Feature Enhancement: pure-PyTorch MAMBA and STPN for video object detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Guanxiong Sun", email = "sungx.cs@outlook.com" }]
keywords = ["video object detection", "imagenet vid", "pytorch", "mamba", "stpn"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


# Hard pins: the *same* spec must resolve on x86_64 (local RTX 4060, sm_89) and
# aarch64 (Isambard-AI GH200, sm_90). torch 2.10.0 is the newest release with
# CUDA 12.8 wheels for BOTH arches -- 2.11+ moved to CUDA 13, which Isambard's
# 565.57.01 driver (CUDA 12.7 native) cannot run without forward-compat shims.
# The `+cu128` local version is required: PyPI's default aarch64 `torch` wheel
# is CPU-only (verified on a GH200 node), so both must come from the
# download.pytorch.org/whl/cu128 index configured under [tool.uv] below.
dependencies = [
  "torch==2.10.0+cu128",
  "torchvision==0.25.0+cu128",
  "numpy>=1.26,<3",
  "pillow>=10",
  "opencv-python-headless>=4.9,<5",
  "pycocotools>=2.0.7",
  "pyyaml>=6",
  "terminaltables>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Logging / experiment tracking; kept optional so the core install stays tiny.
log = ["tensorboard>=2.16"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/guanxiongsun/vfe.pytorch"
Issues = "https://github.com/guanxiongsun/vfe.pytorch/issues"
"Model zoo" = "https://huggingface.co/guanxiongsun/vfe.pytorch"
"Paper (MAMBA)" = "https://arxiv.org/abs/2401.09923"
"Paper (STPN)" = "https://arxiv.org/abs/2402.02574"

# Single-process entry points. Distributed runs go through the modules
# instead, because torchrun needs one: `torchrun ... -m vfe.cli.train`.
[project.scripts]
vfe-train = "vfe.cli.train:main"
vfe-test = "vfe.cli.test:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "vfe.__version__" }

[tool.setuptools.packages.find]
include = ["vfe*"]

[tool.setuptools.package-data]
# The ImageNet VID val motion-IoU table the evaluator reads.
"vfe.evaluation" = ["*.npz"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The legacy mmdet tree, its configs and its tools are reference material -- they
# are read, not edited, and linting them only drowns out findings in new code.
extend-exclude = [
  # Data, outputs and frozen parity artifacts -- not source.
  ".parity-golden",
  "data",
  "work_dirs",
]

[tool.pytest.ini_options]
# Fast, CPU-only unit tests: no legacy environment, no ImageNet VID data.
# Equivalence with the original implementation is checked separately, by the
# two-environment harnesses in tools/checks/ (see docs/parity.md).
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

# tools/checks/ is run by BOTH interpreters: the new one and the legacy Python
# 3.8 conda env that is the parity oracle. Left alone, `ruff --fix` rewrites
# their annotations to 3.10+ syntax (`list[int]`, `X | None`), which 3.8 cannot
# parse -- the harnesses would stop importing in the very env they exist to
# query. CI re-checks this with `python3.8 -m compileall tools/checks/`.
[tool.ruff.lint.per-file-ignores]
"tools/checks/*" = ["UP006", "UP007", "UP035", "UP045"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# torch/torchvision come from the CUDA 12.8 wheel index, NOT PyPI. PyPI's
# default aarch64 wheel is `2.10.0+cpu` (confirmed on a GH200 node), so relying
# on it would silently give a CPU-only build on Isambard. `explicit = true`
# means only the packages mapped in [tool.uv.sources] use this index; every
# other dependency still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
# Keep the lockfile valid for both machines.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
