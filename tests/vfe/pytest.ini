# Unit tests for the pure-PyTorch `vfe` package: fast, CPU-only, and runnable
# without the legacy `vfe` conda env or the ImageNet VID data:
#
#     python -m pytest tests/vfe
#
# This file keeps pytest from picking up the legacy mmdet configuration in the
# repository root (its --xdoctest option needs a plugin the new env lacks).
# Equivalence with the original code is checked separately by the two-env
# harnesses in tools/checks/.
[pytest]
testpaths = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
